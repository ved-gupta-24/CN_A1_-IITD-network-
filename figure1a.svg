<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff;">
  
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ================= MEASUREMENT CONTEXT BOX ================= -->
  <rect x="30" y="20" width="1090" height="50" fill="#f4fbf4" stroke="#4caf50" stroke-width="1.5" rx="5" />
  <text x="50" y="50" font-size="14" font-weight="bold" fill="#333">Measurement context.</text>
  <text x="210" y="50" font-size="14" fill="#333">All measurements taken from Zanskar NC-13 on en0 (Wi-Fi, 5 GHz channel 157, WPA2-Enterprise, RSSI -63 dBm).</text>
  <text x="920" y="50" font-size="14" fill="#333">Host 10.184.30.65/19.</text>

  <!-- ================= THE DOTTED BOUNDARY LINE ================= -->
  <line x1="840" y1="100" x2="840" y2="650" stroke="#2ca02c" stroke-width="2" stroke-dasharray="6,6" />
  <text x="840" y="90" fill="#2ca02c" font-size="13" font-style="italic" text-anchor="middle">IIT-D boundary (last private 10.x -> first public)</text>

  <!-- ================= COLUMN 1: LOCAL SETUP ================= -->
  <!-- MacBook -->
  <rect x="50" y="130" width="220" height="75" fill="#e9f2fb" stroke="#4a90e2" stroke-width="1.5" rx="4" />
  <circle cx="50" cy="130" r="12" fill="#e74c3c" /><text x="50" y="134" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-1</text>
  <text x="160" y="152" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Your MacBook</text>
  <text x="160" y="170" font-size="12" text-anchor="middle" fill="#555">en0 (Wi-Fi) | 10.184.30.65</text>
  <text x="160" y="188" font-size="12" text-anchor="middle" fill="#555">MAC: 14:7f:ce:a0:03:dc</text>

  <path d="M 160 205 L 160 240" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- AP -->
  <rect x="50" y="240" width="220" height="75" fill="#e9f2fb" stroke="#4a90e2" stroke-width="1.5" rx="4" />
  <circle cx="50" cy="240" r="12" fill="#e74c3c" /><text x="50" y="244" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-2</text>
  <text x="160" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">AP / Nearest Wall Port</text>
  <text x="160" y="280" font-size="12" text-anchor="middle" fill="#555">BSSID: a4:b4:39:40:dd:4f</text>
  <text x="160" y="298" font-size="12" font-style="italic" text-anchor="middle" fill="#777">(PHOTO — handwritten placard)</text>

  <path d="M 160 315 L 160 350" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- DNS -->
  <rect x="50" y="350" width="220" height="75" fill="#e9f2fb" stroke="#4a90e2" stroke-width="1.5" rx="4" />
  <circle cx="50" cy="350" r="12" fill="#e74c3c" /><text x="50" y="354" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-1</text>
  <text x="160" y="378" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DNS Resolver</text>
  <text x="160" y="398" font-size="12" text-anchor="middle" fill="#555">2001:df4:e000:26::202</text>

  <path d="M 160 425 L 160 460" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="50" y="460" width="220" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="50" cy="460" r="12" fill="#e74c3c" /><text x="50" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-1</text>
  <text x="160" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Gateway (T1)</text>
  <text x="160" y="500" font-size="12" text-anchor="middle" fill="#555">cfg 10.184.0.1 (VIP)</text>
  <text x="160" y="518" font-size="12" text-anchor="middle" fill="#555">real hop 10.184.0.13 | RTT ~6.2 ms</text>

  <!-- ================= COLUMN 2: CORE ================= -->
  <path d="M 270 497 L 320 497" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Campus Core -->
  <rect x="330" y="460" width="220" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="330" cy="460" r="12" fill="#e74c3c" /><text x="330" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="440" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Campus Core (private 10.x)</text>
  <text x="440" y="500" font-size="12" text-anchor="middle" fill="#555">.255.109.100 -> .119.234.162</text>
  <text x="440" y="518" font-size="12" text-anchor="middle" fill="#555">RTT ~4.2 ms to ~6.4 ms</text>

  <!-- ================= COLUMN 3: CGNAT ================= -->
  <path d="M 550 497 L 600 497" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- CGNAT Block -->
  <rect x="610" y="460" width="200" height="75" fill="#f5eef8" stroke="#9b59b6" stroke-width="1.5" rx="4" />
  <circle cx="610" cy="460" r="12" fill="#e74c3c" /><text x="610" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="710" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">CGNAT Firewall / Edge</text>
  <text x="710" y="500" font-size="12" text-anchor="middle" fill="#555">100.99.0.210</text>
  <text x="710" y="518" font-size="12" text-anchor="middle" fill="#555">RTT ~82.0 ms</text>

  <!-- ================= SPLITTING ARROWS ================= -->
  <!-- To Google -->
  <path d="M 810 497 L 840 497 L 840 387 L 880 387" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  
  <!-- To Jio -->
  <path d="M 810 497 L 880 497" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ================= COLUMN 4: PUBLIC ================= -->
  
  <!-- Google Branch (Top) -->
  <rect x="890" y="350" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="890" cy="350" r="12" fill="#e74c3c" /><text x="890" y="354" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-4</text>
  <text x="1000" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">ALT Path: PUBLIC hop 1</text>
  <text x="1000" y="390" font-size="12" text-anchor="middle" fill="#555">72.14.204.62 (Google Edge)</text>
  <text x="1000" y="408" font-size="12" text-anchor="middle" fill="#555">RTT ~29.7 ms</text>

  <path d="M 1000 350 L 1000 315" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="890" y="240" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="890" cy="240" r="12" fill="#e74c3c" /><text x="890" y="244" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="1000" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DESTINATION (Ping)</text>
  <text x="1000" y="280" font-size="12" text-anchor="middle" fill="#555">8.8.8.8 (Google DNS)</text>
  <text x="1000" y="298" font-size="12" text-anchor="middle" fill="#555">RTT ~39.7 ms</text>

  <!-- Jio Branch (Bottom) -->
  <rect x="890" y="460" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="890" cy="460" r="12" fill="#e74c3c" /><text x="890" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-4</text>
  <text x="1000" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">PUBLIC hop 1</text>
  <text x="1000" y="500" font-size="12" text-anchor="middle" fill="#555">136.232.148.177</text>
  <text x="1000" y="518" font-size="12" text-anchor="middle" fill="#555">Reliance Jio (AS55836) | RTT ~7.0 ms</text>

  <path d="M 1000 535 L 1000 570" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="890" y="570" width="220" height="75" fill="#eee" stroke="#999" stroke-width="1.5" rx="4" />
  <circle cx="890" cy="570" r="12" fill="#e74c3c" /><text x="890" y="574" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="1000" y="592" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DESTINATION (Ping)</text>
  <text x="1000" y="610" font-size="12" text-anchor="middle" fill="#555">49.44.188.14 (Akamai)</text>
  <text x="1000" y="628" font-size="12" text-anchor="middle" fill="#555">RTT ~31.1 ms (Nearest Cache)</text>

</svg>
