<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff;">
  
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ================= MEASUREMENT CONTEXT BOX ================= -->
  <rect x="30" y="20" width="1090" height="50" fill="#f4fbf4" stroke="#4caf50" stroke-width="1.5" rx="5" />
  <text x="50" y="50" font-size="14" font-weight="bold" fill="#333">Measurement context.</text>
  <text x="210" y="50" font-size="14" fill="#333">Surveyed 4 locations (L1 Room, L2 MusicRoom, L3 BSWRoom, L4 LH510) on eduroam/IITD_WIFI.</text>
  <text x="900" y="50" font-size="14" fill="#333">Two access subnets discovered.</text>

  <!-- ================= THE DOTTED BOUNDARY LINE ================= -->
  <line x1="830" y1="100" x2="830" y2="650" stroke="#2ca02c" stroke-width="2" stroke-dasharray="6,6" />
  <text x="830" y="90" fill="#2ca02c" font-size="13" font-style="italic" text-anchor="middle">IIT-D boundary (last private 10.x -> first public)</text>

  <!-- ================= COLUMN 1: L1 (ROOM) ================= -->
  <rect x="40" y="130" width="200" height="75" fill="#e9f2fb" stroke="#4a90e2" stroke-width="1.5" rx="4" />
  <circle cx="40" cy="130" r="12" fill="#e74c3c" /><text x="40" y="134" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-1</text>
  <text x="140" y="152" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Location L1 (Room)</text>
  <text x="140" y="170" font-size="12" text-anchor="middle" fill="#555">IP: 10.184.30.72</text>
  <text x="140" y="188" font-size="12" text-anchor="middle" fill="#555">Subnet: 10.184.0.0/19</text>

  <path d="M 140 205 L 140 240" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="240" width="200" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="40" cy="240" r="12" fill="#e74c3c" /><text x="40" y="244" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="140" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">L1 Access Gateway</text>
  <text x="140" y="280" font-size="12" text-anchor="middle" fill="#555">10.184.0.13</text>
  <text x="140" y="298" font-size="12" text-anchor="middle" fill="#555">(2 Hops to Core)</text>

  <!-- L1 Path to Core -->
  <path d="M 140 315 L 140 387 L 510 387" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ================= COLUMN 2: L2, L3, L4 (PUBLIC) ================= -->
  <rect x="280" y="130" width="200" height="75" fill="#e9f2fb" stroke="#4a90e2" stroke-width="1.5" rx="4" />
  <circle cx="280" cy="130" r="12" fill="#e74c3c" /><text x="280" y="134" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-1</text>
  <text x="380" y="152" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Loc L2, L3, L4 (Public)</text>
  <text x="380" y="170" font-size="12" text-anchor="middle" fill="#555">IP: 10.152.251.125</text>
  <text x="380" y="188" font-size="12" text-anchor="middle" fill="#555">Subnet: 10.152.192.0/18</text>

  <path d="M 380 205 L 380 240" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="280" y="240" width="200" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="280" cy="240" r="12" fill="#e74c3c" /><text x="280" y="244" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="380" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">L2-L4 Access Gateway</text>
  <text x="380" y="280" font-size="12" text-anchor="middle" fill="#555">10.152.224.3</text>
  <text x="380" y="298" font-size="12" text-anchor="middle" fill="#555">(Requires Extra Hop)</text>

  <path d="M 380 315 L 380 350" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="280" y="350" width="200" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="280" cy="350" r="12" fill="#e74c3c" /><text x="280" y="354" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="380" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Distribution Layer</text>
  <text x="380" y="390" font-size="12" text-anchor="middle" fill="#555">10.254.151.9 / .13</text>
  <text x="380" y="408" font-size="12" text-anchor="middle" fill="#555">(3 Hops to Core)</text>

  <!-- L2-L4 Path to Core -->
  <path d="M 480 387 L 510 387" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>


  <!-- ================= COLUMN 3: CORE CONVERGENCE ================= -->
  <rect x="520" y="350" width="220" height="75" fill="#fdf0d5" stroke="#f39c12" stroke-width="1.5" rx="4" />
  <circle cx="520" cy="350" r="12" fill="#e74c3c" /><text x="520" y="354" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="630" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Campus Core Convergence</text>
  <text x="630" y="390" font-size="12" text-anchor="middle" fill="#555">10.255.109.100</text>
  <text x="630" y="408" font-size="12" text-anchor="middle" fill="#555">(All Subnets Merge Here)</text>

  <path d="M 630 425 L 630 460" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="520" y="460" width="220" height="75" fill="#f5eef8" stroke="#9b59b6" stroke-width="1.5" rx="4" />
  <circle cx="520" cy="460" r="12" fill="#e74c3c" /><text x="520" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="630" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">NKN Edge Routing</text>
  <text x="630" y="500" font-size="12" text-anchor="middle" fill="#555">10.1.200.137</text>
  <text x="630" y="518" font-size="12" text-anchor="middle" fill="#555">Campus Boundary Exit</text>


  <!-- ================= SPLITTING ARROWS ================= -->
  <!-- To Google -->
  <path d="M 740 497 L 830 497 L 830 387 L 860 387" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- To Jio -->
  <path d="M 740 497 L 860 497" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>


  <!-- ================= COLUMN 4: PUBLIC ================= -->
  
  <!-- Google Branch (Top) -->
  <rect x="870" y="350" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="870" cy="350" r="12" fill="#e74c3c" /><text x="870" y="354" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-4</text>
  <text x="980" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">ALT Path: PUBLIC hop 1</text>
  <text x="980" y="390" font-size="12" text-anchor="middle" fill="#555">72.14.204.62 (Google)</text>
  <text x="980" y="408" font-size="12" text-anchor="middle" fill="#555">Direct Peering</text>

  <path d="M 980 350 L 980 315" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="870" y="240" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="870" cy="240" r="12" fill="#e74c3c" /><text x="870" y="244" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="980" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DESTINATION (Ping)</text>
  <text x="980" y="280" font-size="12" text-anchor="middle" fill="#555">8.8.8.8 (Google DNS)</text>
  <text x="980" y="298" font-size="12" text-anchor="middle" fill="#555">RTT ~101 ms</text>

  <!-- Jio Branch (Bottom) -->
  <rect x="870" y="460" width="220" height="75" fill="#fae5e3" stroke="#e74c3c" stroke-width="1.5" rx="4" />
  <circle cx="870" cy="460" r="12" fill="#e74c3c" /><text x="870" y="464" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-4</text>
  <text x="980" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">PUBLIC hop 1</text>
  <text x="980" y="500" font-size="12" text-anchor="middle" fill="#555">136.232.148.177</text>
  <text x="980" y="518" font-size="12" text-anchor="middle" fill="#555">Reliance Jio (AS55836)</text>

  <path d="M 980 535 L 980 570" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="870" y="570" width="220" height="75" fill="#eee" stroke="#999" stroke-width="1.5" rx="4" />
  <circle cx="870" cy="570" r="12" fill="#e74c3c" /><text x="870" y="574" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">E-3</text>
  <text x="980" y="592" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DESTINATION (Ping)</text>
  <text x="980" y="610" font-size="12" text-anchor="middle" fill="#555">49.44.117.1 (Akamai)</text>
  <text x="980" y="628" font-size="12" text-anchor="middle" fill="#555">Nearest Cache (MIT Path)</text>

</svg>
